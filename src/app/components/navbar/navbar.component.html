<nav class="navbar" *ngIf="currentUser$ | async as user">
  <div class="navbar-container">
    <div class="navbar-brand">
      <h2 class="app-name">Staff Management</h2>
    </div>

    <div class="navbar-toggle" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="navbar-menu" [class.open]="isMenuOpen">
      <div class="navbar-links">
        <a href="#" routerLink="/dashboard" class="nav-link" (click)="closeMenu()">
          Dashboard
        </a>
        <a href="#" routerLink="/staff" class="nav-link" (click)="closeMenu()">
          Staff
        </a>
        <a href="#" routerLink="/leaves" class="nav-link" (click)="closeMenu()">
          Leaves
        </a>
      </div>

      <div class="navbar-user">
        <div class="user-info">
          <span class="user-email">{{ user.email }}</span>
          <span class="user-role badge badge-primary">{{ user.role }}</span>
        </div>
        <button class="btn btn-secondary btn-small" (click)="logout()">
          Logout
        </button>
      </div>
    </div>
  </div>
</nav>
