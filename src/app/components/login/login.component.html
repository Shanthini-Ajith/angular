<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Staff Management System</h1>
      <p>Please login to continue</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email" class="required">Email Address</label>
        <input
          type="email"
          id="email"
          class="form-control"
          formControlName="email"
          [class.error]="submitted && f['email'].errors"
          placeholder="Enter your email">
        <div *ngIf="submitted && f['email'].errors" class="form-error">
          <span *ngIf="f['email'].errors['required']">Email is required</span>
          <span *ngIf="f['email'].errors['email']">Please enter a valid email</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="required">Password</label>
        <input
          type="password"
          id="password"
          class="form-control"
          formControlName="password"
          [class.error]="submitted && f['password'].errors"
          placeholder="Enter your password">
        <div *ngIf="submitted && f['password'].errors" class="form-error">
          <span *ngIf="f['password'].errors['required']">Password is required</span>
          <span *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="loading">
        <span *ngIf="loading" class="spinner"></span>
        <span *ngIf="!loading">Login</span>
      </button>
    </form>

    <div class="login-footer">
      <p>Don't have an account? <a href="#">Contact Administrator</a></p>
    </div>
  </div>
</div>
